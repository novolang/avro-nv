[package]
name        = "avro-nv"
version     = "0.1.0"
description = "Apache Avro 1.11 for novo-lang, with nothing performed: the schema language parsed once into a value with its naming and union rules checked, schema resolution as a plan built before a byte is decoded, the binary encoding both ways with bounds the caller sets, the object container file with its sync marker and skippable blocks, and single-object encoding with the CRC-64-AVRO Rabin fingerprint.  Compression codecs are values a caller hands in, named functions rather than dependencies, because `avro.codec` is an open set."
license     = "Apache-2.0"

# `experimental` because no program outside this repository has used the
# package yet, and the tests were written against the signatures rather
# than by a consumer.
stability   = "experimental"

# `core`.  Avro is a JSON schema, a zigzag varint and a byte copy:
# arithmetic over bytes and text the caller already holds.  Nothing is
# read, nothing is written, and nothing is generated.
#
# Two things a `core` package may not do, and how each arrives instead.
# Randomness: a container file's sixteen-byte sync marker must be
# random, because a reader splitting a large file scans for it, and
# `core` has no `[rand]`.  `avrofile.writer` takes the marker, and the
# caller spends its own `[rand]` once.  Compression: see
# `[dependencies]`.
layer       = "core"

category    = "encoding"

tags        = ["avro", "serialization", "schema", "schema-evolution", "encoding", "big-data", "sans-io"]
repository  = "https://github.com/novolang/avro-nv"
maintainers = ["novo-lang"]
# 0.16.0 is the toolchain this release was built and tested with: its
# `std.json` keeps a string that holds a zero byte, which the
# differential datums need.
novo        = ">= 0.16.0"

# A library: no `main`, so `novo pkg build` type-checks and
# effect-checks every module under `src/` and writes no binary.

[docs.pages]
"README.md" = "Avro, with a schema mismatch caught before a byte is decoded"

[dependencies]
# None: the stdlib and nothing else.  The decision worth writing down is
# the one about compression codecs.
#
# The Avro specification names three codecs, `null`, `deflate` and
# `snappy`, and says an implementation may add others; `zstandard`,
# `bzip2` and `xz` are in files people have.  `avro.codec` is a string
# in a file's metadata, not an enum.  There were four ways to meet
# that, and this package takes the fourth.
#
#   1. Implement the codecs here.  Four compression formats inside a
#      serialisation package are four packages nobody can use on their
#      own.
#   2. Depend on flate-nv, snappy-nv and zstd-nv.  A manifest has no
#      optional dependencies (docs/manifest.md names no such key), so
#      each would be in every consumer's build, and all three are
#      interface releases today.  A consumer reading an uncompressed
#      file would build three packages it cannot call.
#   3. A closed enum of codec names.  It refuses a file a newer writer
#      produced, and the specification says the set is open.
#   4. A codec is a value: a name and named functions, which is what
#      `avrocodec.AvroCodec` is.  A caller wires flate-nv in when it
#      has it, its own implementation when it has that, and nothing
#      when it needs nothing.  `null` is built in, because it is not
#      compression.
#
# parquet-nv's `PqDecompressor` is the same shape, so a program reading
# Parquet and Avro wires one pair of named functions to both.  The same
# reasoning covers the MD5 and SHA-256 schema fingerprints, which
# `avrofp.wide_fingerprint` takes as a function rather than depending on
# crypto-nv for a path most callers never use.
